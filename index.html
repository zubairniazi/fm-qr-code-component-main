<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./src/output.css" />

    <title>Frontend Mentor | QR code component</title>
  </head>
  <body class="antialiased">
    <main>
      <section
        class="flex justify-center items-center bg-slate-300 min-h-screen"
      >
        <figure
          class="w-[20rem] bg-white p-4 pb-10 rounded-[1.25rem] space-y-6 shadow-2xl/7"
        >
          <img
            src="./images/image-qr-code.png"
            alt="Frontend Mentor QR Code"
            class="rounded-xl w-full"
          />

          <figcaption class="space-y-4 text-center px-4">
            <h2
              class="text-[1.375rem] leading-[120%] tracking-normal font-bold text-slate-900"
            >
              Improve your front-end skills by building projects
            </h2>
            <p
              class="text-slate-500 text-[0.9375rem] leading-[140%] tracking-[0.2px]"
            >
              Scan the QR code to visit Frontend Mentor and take your coding
              skills to the next level
            </p>
          </figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
