<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./src/output.css" />

    <title>Frontend Mentor | QR code component</title>
  </head>
  <body>
    <main>
      <section
        class="flex justify-center items-center p-6 bg-slate-300 min-h-screen"
      >
        <figure class="w-[320px] bg-white p-4 rounded-2xl space-y-6">
          <img
            src="./images/image-qr-code.png"
            alt="Frontend Mentor QR Code"
            class="rounded-xl w-full"
          />

          <figcaption class="space-y-4 text-center px-3 pb-3">
            <h2 class="text-xl font-bold text-slate-900">
              Improve your front-end skills by building projects
            </h2>
            <p class="text-slate-500 text-[15px]">
              Scan the QR code to visit Frontend Mentor and take your coding
              skills to the next level
            </p>
          </figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
